version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: shinobi-postgres
    environment:
      POSTGRES_DB: shinobitrials
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shinobi-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shinobitrials
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      AI_GRADING_API_KEY: ${AI_GRADING_API_KEY:-}
      CERTIFICATE_BASE_URL: http://localhost:3000/certificates
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shinobi-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: on-failure

volumes:
  postgres_data:
