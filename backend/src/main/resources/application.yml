server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

spring:
  application:
    name: shinobi-trials-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shinobitrials}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Google Gemini API Settings (for Question Generation & AI Sensei)
gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: ${GEMINI_API_MODEL:gemini-3.6-flash}
    timeout-ms: 10000

# AI Sensei Grading settings
ai:
  grading:
    api-key: ${AI_GRADING_API_KEY:${GEMINI_API_KEY:}}
    model: ${AI_GRADING_MODEL:gemini-3.6-flash}
    timeout-ms: 8000
    fallback-matching: true


# Certification URL prefix for QR Codes
app:
  certificate:
    base-url: ${CERTIFICATE_BASE_URL:http://localhost:5173/certificates}

# SpringDoc / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
